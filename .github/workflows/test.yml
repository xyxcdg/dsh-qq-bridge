name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    # 跨平台语法检查：只做 node --check，不跑集成测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check bridge.js
          node --check humanize.cjs
          node --check proactive.cjs
          node --check self.cjs
          node --check mood.cjs
          node --check voice.cjs
          node --check panel-server.cjs
          node --check mcp-qqbot.cjs

  test:
    # 完整回归：测试会真起假 OneBot（ws）+ 假 DSH，并复制 .ps1 依赖，
    # 所以按项目实际宿主平台（Windows）跑；逐项执行，失败时能一眼看出是哪一条。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        shell: pwsh
        run: |
          $tests = @(
            'test-trigger.mjs','test-selfcheck.mjs','test-humanize.cjs','test-proactive.cjs',
            'test-self.cjs','test-mood.mjs','test-life.cjs',
            'test-addressing.cjs','test-lists.cjs','test-preempt.cjs','test-recycle-age.cjs'
          )
          foreach ($t in $tests) {
            Write-Host "== $t"
            node $t
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::FAILED $t"
              exit 1
            }
          }
