name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check bridge.js
          node --check humanize.cjs
          node --check proactive.cjs
          node --check self.cjs
          node --check mood.cjs
          node --check voice.cjs
          node --check panel-server.cjs
          node --check mcp-qqbot.cjs

  unit:
    # 纯逻辑单测：每个测试一个 step，失败时从 step 名直接看出是哪条
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test-trigger
        run: node test-trigger.mjs
      - name: test-selfcheck
        run: node test-selfcheck.mjs
      - name: test-humanize
        run: node test-humanize.cjs
      - name: test-proactive
        run: node test-proactive.cjs
      - name: test-self
        run: node test-self.cjs
      - name: test-mood
        run: node test-mood.mjs
      - name: test-life
        run: node test-life.cjs
