name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    # 跨平台语法检查
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check bridge.js
          node --check humanize.cjs
          node --check proactive.cjs
          node --check self.cjs
          node --check mood.cjs
          node --check voice.cjs
          node --check panel-server.cjs
          node --check mcp-qqbot.cjs

  unit:
    # 纯逻辑单测（不 spawn 进程、不占端口）——这些在 CI 上稳定
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        shell: pwsh
        run: |
          $tests = @(
            'test-trigger.mjs','test-selfcheck.mjs','test-humanize.cjs','test-proactive.cjs',
            'test-self.cjs','test-mood.mjs','test-life.cjs'
          )
          foreach ($t in $tests) {
            Write-Host "== $t"
            node $t
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error title=FAILED $t"
              exit 1
            }
          }
